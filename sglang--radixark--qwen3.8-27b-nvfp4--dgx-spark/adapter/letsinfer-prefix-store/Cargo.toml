[package]
name = "letsinfer_prefix_store"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = """
Engine-neutral persistent prefix store: versioned page-aligned records of
opaque named state regions with CRC integrity, exact-token authority,
atomic commits, byte-LRU capacity, and TTL expiry. Extraction of the
validated persistent-prefix design behind Let's Infer's PrefixStore contract.
"""

[lib]
name = "letsinfer_prefix_store"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
crc32fast = "1"
libc = "0.2"
parking_lot = "0.12"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"
