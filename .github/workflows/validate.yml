name: Runtime candidates

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]

concurrency:
  group: runtime-candidates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact runtime revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable released core contract
        env:
          CORE_SHA: ${{ vars.LETSINFER_VERIFICATION_CORE_SHA }}
        run: |
          set -euo pipefail
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "LETSINFER_VERIFICATION_CORE_SHA must be an immutable commit" >&2
            exit 1
          }
      - name: Check out released core contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: letsinferlabs/letsinfer
          ref: ${{ vars.LETSINFER_VERIFICATION_CORE_SHA }}
          path: .core
          persist-credentials: false
      - name: Protect bot-owned qualification files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BOT_LOGIN: ${{ vars.LETSINFER_VERIFICATION_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if test "$BASE_REF" = release && \
             test "$HEAD_REPOSITORY" = letsinferlabs/runtimes; then
            git fetch --no-tags --depth=1 origin main
            if test "$(git rev-parse "${HEAD_SHA}^{tree}")" = \
                    "$(git rev-parse "FETCH_HEAD^{tree}")" && \
               test "$(git rev-parse "${HEAD_SHA}^")" = "$BASE_SHA"; then
              exit 0
            fi
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            '*/benchmark.consensus.json' '*/release.json' 'manifest.json')
          test -z "$changed" && exit 0
          if python3 - "$BASE_SHA" <<'PY'
          import json, pathlib, subprocess, sys

          base = sys.argv[1]
          rows = subprocess.check_output(
              [
                  'git', 'diff', '--name-status', f'{base}...HEAD', '--',
                  '*/benchmark.consensus.json', '*/release.json', 'manifest.json',
              ],
              text=True,
          ).splitlines()
          changes = [tuple(row.split('\t', 1)) for row in rows]
          deleted = [
              path for status, path in changes
              if status == 'D' and path.endswith('/benchmark.consensus.json')
          ]
          if len(deleted) != 1:
              raise SystemExit(1)
          candidate = deleted[0].split('/', 1)[0]
          release_path = f'{candidate}/release.json'
          if set(changes) != {('D', deleted[0]), ('M', release_path)}:
              raise SystemExit(1)
          runtime_path = f'{candidate}/runtime.json'
          old_runtime = json.loads(subprocess.check_output(
              ['git', 'show', f'{base}:{runtime_path}'], text=True,
          ))
          new_runtime = json.loads(pathlib.Path(runtime_path).read_text())
          old_release = json.loads(subprocess.check_output(
              ['git', 'show', f'{base}:{release_path}'], text=True,
          ))
          new_release = json.loads(pathlib.Path(release_path).read_text())
          reset_release = dict(old_release)
          reset_release['provenance'] = None
          if (
              old_runtime.get('id') != new_runtime.get('id')
              or old_runtime.get('version') == new_runtime.get('version')
              or not isinstance(old_release.get('provenance'), dict)
              or new_release != reset_release
              or pathlib.Path(deleted[0]).exists()
          ):
              raise SystemExit(1)
          raise SystemExit(0)
          PY
          then
            exit 0
          fi
          protected=false
          if printf '%s\n' "$changed" | grep -Eq 'benchmark\.consensus\.json$'; then
            protected=true
          fi
          if python3 - "$BASE_SHA" <<'PY'
          import json, pathlib, subprocess, sys
          base = sys.argv[1]
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD', '--', '*/release.json'],
              text=True,
          ).splitlines()
          for name in changed:
              head = json.loads(pathlib.Path(name).read_text())
              try:
                  old = json.loads(subprocess.check_output(
                      ['git', 'show', f'{base}:{name}'], text=True,
                  ))
              except subprocess.CalledProcessError:
                  old = {}
              if head.get('provenance') is not None or old.get('provenance') is not None:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            protected=true
          fi
          if test "$protected" = true; then
            test "$HEAD_REPOSITORY" = "letsinferlabs/runtimes"
            test -n "$BOT_LOGIN"
            test "${GITHUB_ACTOR,,}" = "${BOT_LOGIN,,}" || {
              echo "qualification evidence and provenance are GitHub App owned" >&2
              exit 1
            }
          fi
      - name: Validate schemas and generated catalog
        env:
          LETSINFER_VERIFIER_BYPASS_GITHUB_IDS: ${{ vars.LETSINFER_VERIFIER_BYPASS_GITHUB_IDS }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/generate_manifest.py --validate-only
          python3 tools/generate_manifest.py --previous manifest.json --check
      - name: Require Let's Infer onboarding in changed runtime READMEs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 tools/readme_onboarding.py --base "$BASE_SHA" --head HEAD
      - name: Verify Engine protocol and deterministic runtime packs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/packs" "$RUNNER_TEMP/plans"
          for runtime in */runtime.json; do
            candidate=${runtime%/runtime.json}
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$runtime")
            if test -f "$candidate/adapter/engine-adapter"; then
              python3 "$candidate/adapter/engine-adapter" verify --protocol 2
            fi
            .core/bin/letsinfer pack "$candidate" --output "$RUNNER_TEMP/packs/$candidate-a.letsinfer"
            .core/bin/letsinfer pack "$candidate" --output "$RUNNER_TEMP/packs/$candidate-b.letsinfer"
            cmp "$RUNNER_TEMP/packs/$candidate-a.letsinfer" "$RUNNER_TEMP/packs/$candidate-b.letsinfer"
            python3 tools/candidate_policy.py repositories --candidate "$candidate" \
              --output "$RUNNER_TEMP/repositories.json"
            repository=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtime_repository"])' "$RUNNER_TEMP/repositories.json")
            python3 tools/oci_artifact.py plan \
              --artifact "$RUNNER_TEMP/packs/$candidate-a.letsinfer" \
              --repository "$repository" \
              --candidate "$candidate" --version "$version" \
              --output "$RUNNER_TEMP/plans/$candidate.json"
          done
          python3 - "$RUNNER_TEMP/plans" <<'PY'
          import json, pathlib, sys
          catalog=json.loads(pathlib.Path('manifest.json').read_text())
          advertised={
              (candidate, version): release['source']
              for model in catalog['models'].values()
              for target in model['targets'].values()
              for candidate, record in target['candidates'].items()
              for version, release in record['releases'].items()
          }
          current={
              (p.stem, json.loads(p.read_text())['version']): json.loads(p.read_text())['source']
              for p in pathlib.Path(sys.argv[1]).glob('*.json')
          }
          for key in sorted(set(advertised) & set(current)):
              if advertised[key] != current[key]:
                  raise SystemExit(f'catalog source differs from deterministic pack: {key}')
          PY
      - name: Audit immutable build inputs
        run: |
          set -euo pipefail
          python3 tools/audit_dockerfile.py */image/Dockerfile
          python3 - <<'PY'
          import pathlib
          invalid=[str(path) for path in pathlib.Path('.').rglob('release.json') if path.parent.parent != pathlib.Path('.')]
          if invalid:
              raise SystemExit(f'release metadata must live at candidate root: {invalid}')
          PY
