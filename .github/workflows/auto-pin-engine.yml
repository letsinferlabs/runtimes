name: Apply trusted Engine pin

on:
  workflow_run:
    workflows: [Finalize verifier artifact]
    types: [completed]

permissions:
  actions: read
  attestations: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.event.outputs.artifact }}
      pull_request: ${{ steps.request.outputs.pull_request }}
      proposal_head_sha: ${{ steps.request.outputs.proposal_head_sha }}
      request_key: ${{ steps.request.outputs.request_key }}
      same_repository: ${{ steps.request.outputs.same_repository }}
      finalizer_workflow_sha: ${{ steps.event.outputs.workflow_sha }}
    steps:
      - name: Check out trusted updater code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Resolve the exact failed finalizer
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_RUN_ID: ${{ github.event.workflow_run.id }}
        working-directory: trusted
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZER_RUN_ID" > "$RUNNER_TEMP/finalizer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZER_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/finalizer-run.json" "$RUNNER_TEMP/artifacts.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          run=json.loads(pathlib.Path(sys.argv[1]).read_text())
          artifacts=json.loads(pathlib.Path(sys.argv[2]).read_text()).get("artifacts", [])
          workflow_sha=run.get("head_sha")
          if (run.get("event") != "workflow_run" or run.get("conclusion") != "failure"
                  or run.get("path") != ".github/workflows/finalize-verifier.yml"
                  or run.get("head_branch") != "main"
                  or re.fullmatch(r"[0-9a-f]{40}", str(workflow_sha)) is None):
              raise SystemExit("triggering finalizer identity is invalid")
          matches=[]
          for artifact in artifacts:
              name=str(artifact.get("name"))
              if (re.fullmatch(r"engine-pin-pr-[1-9][0-9]*-[0-9a-f]{40}", name)
                      and artifact.get("expired") is False
                      and re.fullmatch(r"sha256:[0-9a-f]{64}", str(artifact.get("digest")))):
                  matches.append(name)
          if len(matches) != 1:
              raise SystemExit("failed finalizer does not contain one Engine pin request")
          with pathlib.Path(sys.argv[3]).open("a") as output:
              output.write(f"artifact={matches[0]}\nworkflow_sha={workflow_sha}\n")
          PY
      - name: Download and verify the attested pin request
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ steps.event.outputs.artifact }}
        working-directory: trusted
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pin"
          gh run download "$FINALIZER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" --dir "$RUNNER_TEMP/pin"
          test -f "$RUNNER_TEMP/pin/engine-pin-request.json"
          test -f "$RUNNER_TEMP/pin/engine-pin.patch"
          gh attestation verify "$RUNNER_TEMP/pin/engine-pin-request.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/finalize-verifier.yml"
          gh attestation verify "$RUNNER_TEMP/pin/engine-pin.patch" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/finalize-verifier.yml"
      - name: Validate the trusted pin request
        id: request
        env:
          FINALIZER_WORKFLOW_SHA: ${{ steps.event.outputs.workflow_sha }}
        working-directory: trusted
        run: |
          set -euo pipefail
          python3 tools/engine_pin_updater.py validate \
            --request "$RUNNER_TEMP/pin/engine-pin-request.json" \
            --patch "$RUNNER_TEMP/pin/engine-pin.patch" \
            --repository "$GITHUB_REPOSITORY" \
            --finalizer-run-id "${{ github.event.workflow_run.id }}" \
            --finalizer-workflow-sha "$FINALIZER_WORKFLOW_SHA" \
            --github-output "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/validated"
          cp "$RUNNER_TEMP/pin/engine-pin-request.json" "$RUNNER_TEMP/validated/engine-pin-request.json"
      - name: Retain the validated request for the scoped updater
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-engine-pin-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/validated/engine-pin-request.json
          if-no-files-found: error
          retention-days: 30

  apply:
    needs: resolve
    if: needs.resolve.outputs.same_repository == 'true'
    concurrency:
      group: engine-pin-pr-${{ needs.resolve.outputs.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: runtime-verification-bot
    steps:
      - name: Check out trusted updater code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Download the validated metadata-only request
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: trusted
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/request"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "validated-engine-pin-${{ github.event.workflow_run.id }}" \
            --dir "$RUNNER_TEMP/request"
          python3 - "$RUNNER_TEMP/request/engine-pin-request.json" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if value.get("request_key") != "${{ needs.resolve.outputs.request_key }}":
              raise SystemExit("validated Engine pin request differs between jobs")
          PY
      - name: Mint repository-scoped GitHub App token
        id: app
        env:
          APP_ID: ${{ vars.LETSINFER_VERIFICATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.LETSINFER_VERIFICATION_APP_PRIVATE_KEY }}
        working-directory: trusted
        run: |
          set -euo pipefail
          test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY"
          key="$RUNNER_TEMP/github-app.pem"
          printf '%s' "$APP_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          python3 tools/github_app_token.py --app-id "$APP_ID" \
            --private-key "$key" --github-output "$GITHUB_OUTPUT"
          rm -f "$key"
      - name: Atomically apply the exact Engine pin
        id: apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: trusted
        run: |
          set -euo pipefail
          python3 tools/engine_pin_updater.py apply \
            --request "$RUNNER_TEMP/request/engine-pin-request.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Report Engine pin updater result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_HEAD: ${{ needs.resolve.outputs.proposal_head_sha }}
          NEW_HEAD: ${{ steps.apply.outputs.new_head }}
          RESULT: ${{ steps.apply.outputs.result }}
          REQUEST_KEY: ${{ needs.resolve.outputs.request_key }}
        working-directory: trusted
        run: |
          set -euo pipefail
          head="$OLD_HEAD"
          conclusion=failure
          title="Trusted Engine pin update failed"
          summary="The updater left the pull request unchanged. Review updater run $GITHUB_RUN_ID; retrying is safe."
          if [[ "$NEW_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            head="$NEW_HEAD"
            conclusion=success
            title="Trusted Engine pin applied"
            summary="Result $RESULT; old head $OLD_HEAD; new head $NEW_HEAD; request $REQUEST_KEY. Exact-head verification was retriggered by the App commit."
          fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input - <<JSON
          {"name":"runtime/engine-pin","head_sha":"$head","status":"completed","conclusion":"$conclusion","output":{"title":"$title","summary":"$summary"}}
          JSON

  fork:
    needs: resolve
    if: needs.resolve.outputs.same_repository == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the safe fork fallback
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.proposal_head_sha }}
          ARTIFACT: ${{ needs.resolve.outputs.artifact }}
          FINALIZER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          summary="Fork branches never receive a base-repository credential. Run: gh run download $FINALIZER_RUN_ID --repo $GITHUB_REPOSITORY --name $ARTIFACT; git apply engine-pin.patch; git push"
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input - <<JSON
          {"name":"runtime/engine-pin","head_sha":"$HEAD_SHA","status":"completed","conclusion":"action_required","output":{"title":"Apply the attested Engine pin on the fork","summary":"$summary"}}
          JSON
