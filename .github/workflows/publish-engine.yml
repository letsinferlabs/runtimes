name: Publish Engine OCI

on:
  push:
    branches: [main]
    paths:
      - "*/engine/**"
      - "*/adapter/**"
      - "*/image/**"
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact runtime candidate ID
        required: true
        type: string
      rebuild:
        description: Rebuild the Engine to verify reproducibility instead of retrying its pinned SBOM
        required: false
        default: false
        type: boolean

concurrency:
  group: engine-${{ github.ref }}-${{ inputs.candidate || 'changed' }}
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      candidates: ${{ steps.changes.outputs.candidates }}
      count: ${{ steps.changes.outputs.count }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out released core contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: letsinferlabs/letsinfer
          path: .core
          persist-credentials: false
      - name: Resolve changed candidates
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            python3 tools/changed_candidates.py --candidate "$CANDIDATE" \
              --github-output "$GITHUB_OUTPUT"
          else
            base="$BEFORE"
            if [[ "$base" =~ ^0+$ ]]; then base=$(git rev-parse "$GITHUB_SHA^"); fi
            python3 tools/changed_candidates.py --base "$base" --head "$GITHUB_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi
  publish:
    needs: detect
    if: needs.detect.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.detect.outputs.candidates) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out released core packer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: letsinferlabs/letsinfer
          path: .core
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve the pinned Engine for a manual SBOM retry
        id: pinned
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE/runtime.json" "$CANDIDATE" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          runtime=json.loads(pathlib.Path(sys.argv[1]).read_text())
          candidate=sys.argv[2]
          output=pathlib.Path(sys.argv[3])
          reference=runtime['engine']['oci']['reference']
          immutable_id=runtime['engine']['oci']['immutable_id']
          expected=f'ghcr.io/letsinferlabs/engines/{candidate}@'
          if not reference.startswith(expected) or re.fullmatch(
              r'ghcr\.io/letsinferlabs/engines/[^@]+@sha256:[0-9a-f]{64}', reference
          ) is None:
              raise SystemExit('pinned Engine reference is invalid')
          if re.fullmatch(r'sha256:[0-9a-f]{64}', immutable_id) is None:
              raise SystemExit('pinned Engine configuration identity is invalid')
          with output.open('a', encoding='utf-8') as stream:
              stream.write(f'platform_reference={reference}\n')
              stream.write(f'immutable_id={immutable_id}\n')
          PY
      - name: Verify the pinned Engine configuration identity
        if: github.event_name == 'workflow_dispatch' && !inputs.rebuild
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.pinned.outputs.platform_reference }}" --raw \
            > "$RUNNER_TEMP/pinned-engine-platform.json"
          python3 - "$RUNNER_TEMP/pinned-engine-platform.json" \
            "${{ steps.pinned.outputs.immutable_id }}" <<'PY'
          import json, pathlib, sys
          actual=json.loads(pathlib.Path(sys.argv[1]).read_text())['config']['digest']
          if actual != sys.argv[2]:
              raise SystemExit(f'pinned Engine configuration differs: {actual}')
          PY
      - name: Build and publish immutable Engine OCI
        id: engine
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          repository="ghcr.io/letsinferlabs/engines/$CANDIDATE"
          image="$repository:$GITHUB_SHA"
          docker buildx build "$CANDIDATE" \
            --file "$CANDIDATE/image/Dockerfile" \
            --platform linux/arm64 \
            --build-context letsinfer-tools=. \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --provenance=true --sbom=false \
            --output "type=registry,name=$image,rewrite-timestamp=true" \
            --metadata-file "$RUNNER_TEMP/engine.json"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/engine.json")
          docker buildx imagetools inspect "$image@$digest" --raw > "$RUNNER_TEMP/engine-index.json"
          platform_digest=$(python3 - "$RUNNER_TEMP/engine-index.json" "$digest" <<'PY'
          import json, pathlib, re, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if isinstance(value.get('config'), dict):
              selected=sys.argv[2]
          else:
              matches=[
                  item['digest']
                  for item in value.get('manifests', [])
                  if item.get('platform', {}).get('os') == 'linux'
                  and item.get('platform', {}).get('architecture') == 'arm64'
              ]
              if len(matches) != 1:
                  raise SystemExit('Engine OCI index does not contain exactly one linux/arm64 image')
              selected=matches[0]
          if re.fullmatch(r'sha256:[0-9a-f]{64}', selected) is None:
              raise SystemExit('Engine OCI platform digest is invalid')
          print(selected)
          PY
          )
          docker buildx imagetools inspect "$repository@$platform_digest" --raw > "$RUNNER_TEMP/engine-platform.json"
          image_id=$(python3 - "$RUNNER_TEMP/engine-platform.json" <<'PY'
          import json, pathlib, re, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          digest=value.get('config', {}).get('digest')
          if re.fullmatch(r'sha256:[0-9a-f]{64}', str(digest)) is None:
              raise SystemExit('Engine OCI configuration digest is invalid')
          print(digest)
          PY
          )
          python3 tools/pin_engine.py \
            --runtime "$CANDIDATE/runtime.json" \
            --reference "$repository@$platform_digest" \
            --immutable-id "$image_id"
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$CANDIDATE/runtime.json")
          .core/bin/letsinfer pack "$CANDIDATE" \
            --output "$RUNNER_TEMP/$CANDIDATE.letsinfer"
          python3 tools/oci_artifact.py plan \
            --artifact "$RUNNER_TEMP/$CANDIDATE.letsinfer" \
            --repository "ghcr.io/letsinferlabs/runtimes/$CANDIDATE" \
            --candidate "$CANDIDATE" --version "$version" \
            --output "$RUNNER_TEMP/$CANDIDATE-plan.json"
          echo "platform_reference=$repository@$platform_digest" >> "$GITHUB_OUTPUT"
          echo "immutable_id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Prepare the deterministic Engine pin review patch
        id: pin_review
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/engine-pin-$CANDIDATE.patch"
          if git diff --quiet -- "$CANDIDATE"; then
            echo 'Engine OCI already pinned; no qualification reset required.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --binary -- "$CANDIDATE" > "$patch"
          test -s "$patch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "Engine pin review patch: engine-pin-$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Engine pin ready::Download and review engine-pin-$CANDIDATE"
      - name: Upload the deterministic Engine pin review patch
        if: steps.pin_review.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-pin-${{ matrix.candidate }}
          path: ${{ runner.temp }}/engine-pin-${{ matrix.candidate }}.patch
          if-no-files-found: error
          retention-days: 30
      - name: Export deterministic Engine package inventory
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/$CANDIDATE-inventory"
          rm -rf "$destination"
          docker buildx build "$CANDIDATE" \
            --file "$CANDIDATE/image/Dockerfile" \
            --platform linux/arm64 \
            --target letsinfer-engine-inventory \
            --build-context letsinfer-tools=. \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --output "type=local,dest=$destination"
          test -s "$destination/engine-inventory.json"
      - name: Bind Engine package inventory to exact OCI identity
        id: sbom
        env:
          CANDIDATE: ${{ matrix.candidate }}
          ENGINE_CONFIG: ${{ steps.engine.outputs.immutable_id || steps.pinned.outputs.immutable_id }}
          ENGINE_IMAGE: ${{ steps.engine.outputs.platform_reference || steps.pinned.outputs.platform_reference }}
        run: |
          set -euo pipefail
          python3 tools/engine_sbom.py spdx \
            --inventory "$RUNNER_TEMP/$CANDIDATE-inventory/engine-inventory.json" \
            --candidate "$CANDIDATE" \
            --image "$ENGINE_IMAGE" \
            --config-digest "$ENGINE_CONFIG" \
            --output "$RUNNER_TEMP/$CANDIDATE.spdx.json"
          echo "subject_name=${ENGINE_IMAGE%@*}" >> "$GITHUB_OUTPUT"
          echo "subject_digest=${ENGINE_IMAGE##*@}" >> "$GITHUB_OUTPUT"
      - name: Upload exact Engine SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-sbom-${{ matrix.candidate }}.spdx.json
          path: ${{ runner.temp }}/${{ matrix.candidate }}.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Attest exact Engine SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.sbom.outputs.subject_name }}
          subject-digest: ${{ steps.sbom.outputs.subject_digest }}
          sbom-path: ${{ runner.temp }}/${{ matrix.candidate }}.spdx.json
          push-to-registry: true
          create-storage-record: false
