name: Runtime release

on:
  push:
    branches: [release]

concurrency:
  group: runtime-release
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-runtime-release
    steps:
      - name: Check out exact runtime revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable released core contract
        env:
          CORE_SHA: ${{ vars.LETSINFER_VERIFICATION_CORE_SHA }}
        run: |
          set -euo pipefail
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "LETSINFER_VERIFICATION_CORE_SHA must be an immutable commit" >&2
            exit 1
          }
      - name: Check out released core contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: letsinferlabs/letsinfer
          ref: ${{ vars.LETSINFER_VERIFICATION_CORE_SHA }}
          path: .core
          persist-credentials: false
      - name: Validate release inputs
        env:
          LETSINFER_VERIFIER_BYPASS_GITHUB_IDS: ${{ vars.LETSINFER_VERIFIER_BYPASS_GITHUB_IDS }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/generate_manifest.py --previous manifest.json --check
          python3 - <<'PY'
          import json, pathlib
          catalog=json.loads(pathlib.Path('manifest.json').read_text())
          for model, model_record in catalog['models'].items():
              for target, record in model_record['targets'].items():
                  if record['recommended'] is None:
                      raise SystemExit(f'{model}/{target} has no qualified recommendation')
          PY
      - name: Build deterministic catalog runtime packs
        id: packs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir "$RUNNER_TEMP/packs" "$RUNNER_TEMP/plans"
          for runtime in */runtime.json; do
            candidate=${runtime%/runtime.json}
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$runtime")
            python3 - "$candidate" "$version" <<'PY' || continue
          import json, pathlib, sys
          candidate, version = sys.argv[1:]
          catalog=json.loads(pathlib.Path('manifest.json').read_text())
          found=any(
              version in record['releases']
              for model in catalog['models'].values()
              for target in model['targets'].values()
              for name, record in target['candidates'].items()
              if name == candidate
          )
          raise SystemExit(0 if found else 1)
          PY
            .core/bin/letsinfer pack "$candidate" --output "$RUNNER_TEMP/packs/$candidate.letsinfer"
            python3 tools/candidate_policy.py repositories --candidate "$candidate" \
              --output "$RUNNER_TEMP/repositories.json"
            repository=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtime_repository"])' "$RUNNER_TEMP/repositories.json")
            python3 tools/oci_artifact.py plan \
              --artifact "$RUNNER_TEMP/packs/$candidate.letsinfer" \
              --repository "$repository" \
              --candidate "$candidate" --version "$version" \
              --output "$RUNNER_TEMP/plans/$candidate.json"
          done
          python3 - "$RUNNER_TEMP/plans" <<'PY'
          import json, pathlib, sys
          catalog=json.loads(pathlib.Path('manifest.json').read_text())
          advertised={
              (candidate, version): release['source']
              for model in catalog['models'].values()
              for target in model['targets'].values()
              for candidate, record in target['candidates'].items()
              for version, release in record['releases'].items()
          }
          planned={
              (p.stem, json.loads(p.read_text())['version']): json.loads(p.read_text())['source']
              for p in pathlib.Path(sys.argv[1]).glob('*.json')
          }
          for key, source in planned.items():
              if advertised.get(key) != source:
                  raise SystemExit(f'qualified catalog source differs from deterministic pack: {key}')
          PY
          plans=("$RUNNER_TEMP"/plans/*.json)
          if ((${#plans[@]})); then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify anonymously pullable Engine and runtime artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for plan in "$RUNNER_TEMP"/plans/*.json; do
            candidate=$(basename "$plan" .json)
            source=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"])' "$plan")
            config=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["config_digest"])' "$plan")
            python3 tools/oci_layout.py verify --reference "$source" --config-digest "$config"
            engine=$(python3 -c 'import json,sys; engine=json.load(open(sys.argv[1]))["engine"]; value=engine.get("distribution", engine.get("oci")); kind=value.get("kind", "oci-container"); print(kind+"\t"+str(value.get("reference", ""))+"\t"+str(value.get("immutable_id", "")))' "$candidate/runtime.json")
            IFS=$'\t' read -r engine_kind engine_reference engine_config <<< "$engine"
            if test "$engine_kind" = oci-container; then
              platform=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"]["platform"])' "$candidate/runtime.json")
              python3 tools/oci_layout.py verify --reference "$engine_reference" \
                --config-digest "$engine_config" --platform "$platform"
            fi
          done
      - name: Sign catalog and revocation ledger
        env:
          LETSINFER_CATALOG_SIGNING_KEY_B64: ${{ secrets.LETSINFER_CATALOG_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$LETSINFER_CATALOG_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/catalog-private.pem"
          public="$RUNNER_TEMP/catalog-public.pem"
          candidate="$RUNNER_TEMP/catalog-release"
          mkdir "$candidate"
          printf '%s' "$LETSINFER_CATALOG_SIGNING_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          cmp "$public" .core/core/trust/catalog-public-key.pem
          cp manifest.json "$candidate/catalog.json"
          cp revocations.json "$candidate/revocations.json"
          cp "$public" "$candidate/catalog-public-key.pem"
          python3 tools/sign_manifest.py --catalog "$candidate/catalog.json" \
            --private-key "$key" --public-key "$public" \
            --output "$candidate/catalog.json.sig"
          python3 tools/sign_document.py --document "$candidate/revocations.json" \
            --kind letsinfer.revocations --private-key "$key" --public-key "$public" \
            --output "$candidate/revocations.json.sig"
          rm -f "$key"
      - name: Verify exact signed release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalog-release"
          PYTHONPATH=.core python3 - <<'PY'
          import os, pathlib
          from core.runtime_packs import load_catalog
          from core.revocations import load_ledger
          root=pathlib.Path(os.environ['RUNNER_TEMP']) / 'catalog-release'
          catalog=load_catalog(str(root / 'catalog.json'), public_key=str(root / 'catalog-public-key.pem'))
          ledger, _data, _signature=load_ledger(str(root / 'revocations.json'), public_key=root / 'catalog-public-key.pem')
          assert catalog['schema_version'] == 6 and ledger['schema_version'] == 1
          PY
          python3 - "$candidate" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1]); commit=sys.argv[2]
          if re.fullmatch(r'[0-9a-f]{40}', commit) is None:
              raise SystemExit('runtime commit identity is invalid')
          digest=lambda name: hashlib.sha256((root / name).read_bytes()).hexdigest()
          value={
              'schema_version': 2,
              'runtime_commit': commit,
              'catalog_sha256': digest('catalog.json'),
              'catalog_signature_sha256': digest('catalog.json.sig'),
              'revocations_sha256': digest('revocations.json'),
              'revocations_signature_sha256': digest('revocations.json.sig'),
              'public_key_sha256': digest('catalog-public-key.pem'),
          }
          (root / 'catalog-release.json').write_text(json.dumps(value, sort_keys=True, separators=(',', ':'))+'\n')
          PY
      - name: Publish signed production catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalog-release"
          tag="catalog-v6-$GITHUB_SHA"
          assets=(catalog.json catalog.json.sig revocations.json revocations.json.sig catalog-public-key.pem catalog-release.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-catalog-release"
            mkdir "$existing"
            for name in "${assets[@]}"; do gh release download "$tag" --dir "$existing" --pattern "$name"; done
            for name in "${assets[@]}"; do cmp "$candidate/$name" "$existing/$name"; done
          else
            qualified_assets=()
            for name in "${assets[@]}"; do qualified_assets+=("$candidate/$name"); done
            gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "Let's Infer runtime catalog" \
              --notes "Signed production runtime catalog and revocation ledger." \
              "${qualified_assets[@]}"
          fi
          release="$RUNNER_TEMP/catalog-release-view.json"
          gh release view "$tag" --json targetCommitish,assets > "$release"
          python3 - "$release" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected={'catalog.json','catalog.json.sig','revocations.json','revocations.json.sig','catalog-public-key.pem','catalog-release.json'}
          names={asset.get('name') for asset in value.get('assets', [])}
          if value.get('targetCommitish') != sys.argv[2] or names != expected:
              raise SystemExit('catalog release commit or exact asset set differs')
          PY
      - name: Attest qualified runtime packs
        if: steps.packs.outputs.available == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packs/*.letsinfer
      - name: Attest signed selection metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/catalog-release/catalog.json
            ${{ runner.temp }}/catalog-release/catalog.json.sig
            ${{ runner.temp }}/catalog-release/revocations.json
            ${{ runner.temp }}/catalog-release/revocations.json.sig
            ${{ runner.temp }}/catalog-release/catalog-public-key.pem
            ${{ runner.temp }}/catalog-release/catalog-release.json
