name: Runtime release

on:
  push:
    branches: [release]

concurrency:
  group: runtime-release
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-runtime-release
    steps:
      - name: Check out exact runtime revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out released core contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: letsinferlabs/letsinfer
          path: .core
          persist-credentials: false
      - name: Validate release inputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/generate_manifest.py --previous manifest.json --check
          python3 - <<'PY'
          import json
          import pathlib
          catalog = json.loads(pathlib.Path('manifest.json').read_text())
          for model, model_record in catalog['models'].items():
              for target, record in model_record['targets'].items():
                  if record['recommended'] is None:
                      raise SystemExit(f'{model}/{target} has no qualified recommendation')
          PY
      - name: Build deterministic runtime packs and verify planned identities
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/packs" "$RUNNER_TEMP/plans" "$RUNNER_TEMP/benchmark-plans"
          for runtime in */runtime.json; do
            candidate=${runtime%/runtime.json}
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$runtime")
            .core/bin/letsinfer pack "$candidate" \
              --output "$RUNNER_TEMP/packs/$candidate.letsinfer"
            python3 tools/oci_artifact.py plan \
              --artifact "$RUNNER_TEMP/packs/$candidate.letsinfer" \
              --repository "ghcr.io/letsinferlabs/runtimes/$candidate" \
              --candidate "$candidate" --version "$version" \
              --output "$RUNNER_TEMP/plans/$candidate.json"
            python3 -m tools.benchmark_artifact plan \
              --evidence "$candidate/benchmark.json" \
              --runtime-plan "$RUNNER_TEMP/plans/$candidate.json" \
              --repository "ghcr.io/letsinferlabs/benchmarks/$candidate" \
              --candidate "$candidate" --version "$version" \
              --output "$RUNNER_TEMP/benchmark-plans/$candidate.json"
          done
          python3 - "$RUNNER_TEMP/plans" <<'PY'
          import json, pathlib, sys
          catalog=json.loads(pathlib.Path('manifest.json').read_text())
          advertised={
              candidate: record['releases'][record['latest']]['source']
              for model in catalog['models'].values()
              for target in model['targets'].values()
              for candidate, record in target['candidates'].items()
          }
          planned={p.stem: json.loads(p.read_text())['source'] for p in pathlib.Path(sys.argv[1]).glob('*.json')}
          if advertised != planned:
              for candidate in sorted(set(advertised) | set(planned)):
                  if advertised.get(candidate) != planned.get(candidate):
                      print(f'{candidate}: manifest={advertised.get(candidate)} planned={planned.get(candidate)}')
              raise SystemExit('manifest sources do not match deterministic runtime OCI plans')
          evidence={
              candidate: record['releases'][record['latest']]['benchmark']['evidence']
              for model in catalog['models'].values()
              for target in model['targets'].values()
              for candidate, record in target['candidates'].items()
          }
          evidence_planned={
              p.stem: json.loads(p.read_text())['source']
              for p in pathlib.Path(sys.argv[1]).parent.joinpath('benchmark-plans').glob('*.json')
          }
          if evidence != evidence_planned:
              raise SystemExit('manifest benchmark evidence does not match deterministic OCI plans')
          PY
      - name: Publish immutable runtime OCI artifacts
        env:
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          for runtime in */runtime.json; do
            candidate=${runtime%/runtime.json}
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$runtime")
            python3 tools/oci_artifact.py push \
              --artifact "$RUNNER_TEMP/packs/$candidate.letsinfer" \
              --repository "ghcr.io/letsinferlabs/runtimes/$candidate" \
              --candidate "$candidate" --version "$version"
            python3 -m tools.benchmark_artifact push \
              --evidence "$candidate/benchmark.json" \
              --runtime-plan "$RUNNER_TEMP/plans/$candidate.json" \
              --repository "ghcr.io/letsinferlabs/benchmarks/$candidate" \
              --candidate "$candidate" --version "$version"
          done
      - name: Sign the exact generated catalog
        env:
          LETSINFER_CATALOG_SIGNING_KEY_B64: ${{ secrets.LETSINFER_CATALOG_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$LETSINFER_CATALOG_SIGNING_KEY_B64"
          key="$RUNNER_TEMP/catalog-private.pem"
          public="$RUNNER_TEMP/catalog-public.pem"
          candidate="$RUNNER_TEMP/catalog-release"
          mkdir "$candidate"
          printf '%s' "$LETSINFER_CATALOG_SIGNING_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          cmp "$public" .core/core/trust/catalog-public-key.pem
          cp manifest.json "$candidate/catalog.json"
          cp "$public" "$candidate/catalog-public-key.pem"
          python3 tools/sign_manifest.py --catalog "$candidate/catalog.json" \
            --private-key "$key" --public-key "$public" \
            --output "$candidate/catalog.json.sig"
          rm -f "$key"
      - name: Verify the immutable signed catalog release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalog-release"
          PYTHONPATH=.core python3 - <<'PY'
          from core.runtime_packs import load_catalog
          import os
          root = os.environ['RUNNER_TEMP'] + '/catalog-release'
          catalog = load_catalog(root + '/catalog.json', public_key=root + '/catalog-public-key.pem')
          assert catalog['schema_version'] == 5
          PY
          python3 - "$candidate" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, re, sys
          root=pathlib.Path(sys.argv[1])
          commit=sys.argv[2]
          if re.fullmatch(r'[0-9a-f]{40}', commit) is None:
              raise SystemExit('runtime commit identity is invalid')
          digest=lambda name: hashlib.sha256((root / name).read_bytes()).hexdigest()
          value={
              'schema_version': 1,
              'runtime_commit': commit,
              'catalog_sha256': digest('catalog.json'),
              'signature_sha256': digest('catalog.json.sig'),
              'public_key_sha256': digest('catalog-public-key.pem'),
          }
          (root / 'catalog-release.json').write_text(
              json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Publish the signed production catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalog-release"
          tag="catalog-v6-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-catalog-release"
            mkdir "$existing"
            gh release download "$tag" --dir "$existing" \
              --pattern catalog.json --pattern catalog.json.sig \
              --pattern catalog-public-key.pem --pattern catalog-release.json
            for name in catalog.json catalog.json.sig catalog-public-key.pem catalog-release.json; do
              cmp "$candidate/$name" "$existing/$name"
            done
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "Let's Infer runtime catalog" \
              --notes "Signed production runtime catalog." \
              "$candidate/catalog.json" \
              "$candidate/catalog.json.sig" \
              "$candidate/catalog-public-key.pem" \
              "$candidate/catalog-release.json"
          fi
          release="$RUNNER_TEMP/catalog-release-view.json"
          gh release view "$tag" --json targetCommitish,assets > "$release"
          python3 - "$release" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          value=json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected={
              'catalog-release.json',
              'catalog-public-key.pem',
              'catalog.json',
              'catalog.json.sig',
          }
          names={asset.get('name') for asset in value.get('assets', [])}
          if value.get('targetCommitish') != sys.argv[2] or names != expected:
              raise SystemExit('catalog candidate release identity or asset set differs')
          PY
      - name: Attest runtime packs and catalog
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/packs/*.letsinfer
            ${{ runner.temp }}/benchmark-plans/*.json
            */benchmark.json
            ${{ runner.temp }}/catalog-release/catalog.json
            ${{ runner.temp }}/catalog-release/catalog.json.sig
            ${{ runner.temp }}/catalog-release/catalog-public-key.pem
            ${{ runner.temp }}/catalog-release/catalog-release.json
