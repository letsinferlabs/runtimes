# Engine SBOMs inventory the package-manager state that defines the shipped
# Ubuntu and Python environment. Binary/content catalogers are intentionally
# excluded: scanning every CUDA binary exhausts the bounded GitHub runner and
# does not add package-manager inventory.
parallelism: 1
default-catalogers:
  - dpkg-db-cataloger
  - python-installed-package-cataloger
file:
  selection: none
