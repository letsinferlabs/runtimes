[package]
name = "letsinfer_prefix_capi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = """
Thin C ABI over letsinfer_prefix_store (the engine-neutral Let's Infer
persistent prefix cache). Built as libletsinfer_prefix_capi.so; ds4-server
dlopen()s it when DS4_LETSINFER_CACHE=1. Every entry point is panic-safe and
returns error codes: cache problems must never crash the caller.
"""

[lib]
name = "letsinfer_prefix_capi"
crate-type = ["cdylib"]

[dependencies]
letsinfer_prefix_store = { path = "../vendor/letsinfer_prefix_store" }
